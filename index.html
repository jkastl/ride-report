<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Ride Report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    background: #0a0a0f;
    color: #f0f2f8;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-text-size-adjust: 100%;
  }
  #header {
    padding: 12px calc(16px + var(--safe-r)) 8px calc(16px + var(--safe-l));
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #262640;
  }
  #header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #d6dcff;
  }
  #status {
    font-size: 12px;
    color: #a9b0cc;
    text-align: right;
  }
  #status.active { color: #5ef08f; }
  #status.warn { color: #fbbf24; }
  #status.err { color: #ff7b7b; }
  #version {
    font-size: 11px;
    color: #b6bcd8;
    position: absolute;
    top: 6px;
    left: calc(8px + var(--safe-l));
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #version.stale {
    color: #ffe066;
    pointer-events: auto;
    cursor: pointer;
  }
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #readout {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: #242440;
    border-top: 1px solid #262640;
    padding-bottom: var(--safe-b);
    padding-left: var(--safe-l);
    padding-right: var(--safe-r);
  }
  #readout.hidden { display: none; }
  .val-box {
    background: #0d0d1a;
    padding: 10px 12px;
    text-align: center;
  }
  .val-label {
    font-size: 10px;
    color: #9aa2c2;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 2px;
  }
  .val-num {
    font-size: 18px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }
  #val-x .val-num { color: #ff9494; }
  #val-y .val-num { color: #84c5ff; }
  #val-z .val-num { color: #c3aeff; }
  #start-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px 32px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 24px rgba(79,70,229,0.4);
    -webkit-tap-highlight-color: transparent;
  }
  #start-btn:active { background: #4338ca; }
  #controls {
    position: absolute;
    bottom: calc(8px + var(--safe-b));
    right: calc(8px + var(--safe-r));
    left: calc(8px + var(--safe-l));
    display: flex;
    flex-direction: column;
    gap: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #controls.visible { opacity: 1; pointer-events: auto; }
  #controls.above-readout { --safe-b: 0px; }
  .ctrl-row {
    display: flex;
    gap: 4px;
  }
  .ctrl-btn {
    flex: 1 1 0;
    min-width: 0;
    background: rgba(255,255,255,0.10);
    color: #e2e6f8;
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 8px;
    padding: 7px 2px;
    font-size: clamp(10px, 3.4vw, 12.5px);
    font-family: inherit;
    white-space: nowrap;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:active { background: rgba(255,255,255,0.20); }
  .ctrl-btn.on {
    background: rgba(99,102,241,0.35);
    color: #dde3ff;
    border-color: rgba(129,132,255,0.7);
  }
  .ctrl-btn:disabled { opacity: 0.4; }
</style>
</head>
<body>

<div id="header">
  <h1>Ride Report</h1>
  <span id="status">Waiting</span>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <button id="start-btn">Enable Motion</button>
  <span id="version">v1.27 2026-09-18</span>
  <div id="controls">
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btn-clear">Clear Trail</button>
      <button class="ctrl-btn" id="btn-pause">Pause</button>
      <button class="ctrl-btn" id="btn-wake">Keep Awake</button>
      <button class="ctrl-btn" id="btn-saver">🔋 Saver</button>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn on" id="btn-smooth">Smoothing</button>
      <button class="ctrl-btn on" id="btn-invert">Invert Axes</button>
      <button class="ctrl-btn" id="btn-raw">Raw Data</button>
    </div>
  </div>
</div>

<div id="readout" class="hidden">
  <div class="val-box" id="val-x">
    <div class="val-label">X &mdash; Left/Right</div>
    <div class="val-num" id="num-x">+0.000G</div>
  </div>
  <div class="val-box" id="val-y">
    <div class="val-label">Y &mdash; Fwd/Back</div>
    <div class="val-num" id="num-y">+0.000G</div>
  </div>
  <div class="val-box" id="val-z">
    <div class="val-label">Z &mdash; Vertical</div>
    <div class="val-num" id="num-z">+0.000G</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const statusEl = document.getElementById('status');
  const versionEl = document.getElementById('version');
  const startBtn = document.getElementById('start-btn');
  const controls = document.getElementById('controls');
  const readout = document.getElementById('readout');
  const numX = document.getElementById('num-x');
  const numY = document.getElementById('num-y');
  const numZ = document.getElementById('num-z');
  const btnClear  = document.getElementById('btn-clear');
  const btnPause  = document.getElementById('btn-pause');
  const btnSmooth = document.getElementById('btn-smooth');
  const btnInvert = document.getElementById('btn-invert');
  const btnWake   = document.getElementById('btn-wake');
  const btnRaw    = document.getElementById('btn-raw');
  const btnSaver  = document.getElementById('btn-saver');

  const G = 9.81;
  const MAX_G = 0.5;
  const FLOOR_G = 0.01;
  const HISTORY_MS = 15000;
  const CAP = 2400;
  const SMOOTH_TAU = 0.2;
  const GRAVITY_TAU = 1.0;
  const PEAK_TAU = 3.3;
  const SENSOR_TIMEOUT_MS = 2500;
  const UPDATE_EVERY_MS = 300000;
  const UPDATE_GAP_MS = 60000;
  const STALL_MS = 3000;

  const TIERS = {
    high:  { frameMs: 1000 / 60, maxDpr: 3, points: 480, buckets: 24, readoutMs: 50 },
    saver: { frameMs: 1000 / 30, maxDpr: 2, points: 360, buckets: 18, readoutMs: 100 },
  };
  const RENDER_POINTS_MAX = 480;
  // Without slack a 16.67ms rAF tick loses the race against a 16.67ms budget
  // and every second frame is dropped, halving the tier back to 30fps.
  const FRAME_SLACK_MS = 2;

  let frameMs = TIERS.high.frameMs;
  let maxDpr = TIERS.high.maxDpr;
  let renderPoints = TIERS.high.points;
  let trailBuckets = TIERS.high.buckets;
  let readoutMs = TIERS.high.readoutMs;

  const LEVELS = [
    { label: 'Severe',   min: 0.30, color: '#ff5c5c' },
    { label: 'Moderate', min: 0.12, color: '#ffa94d' },
    { label: 'Light',    min: 0.03, color: '#ffe066' },
    { label: 'Calm',     min: 0,    color: '#5ef08f' },
  ];

  const bufX = new Float32Array(CAP);
  const bufY = new Float32Array(CAP);
  const bufT = new Float64Array(CAP);
  let head = 0, count = 0;

  const ptX = new Float32Array(RENDER_POINTS_MAX);
  const ptY = new Float32Array(RENDER_POINTS_MAX);

  const bg = document.createElement('canvas');
  const bgCtx = bg.getContext('2d', { alpha: false });

  let started = false, paused = false, hidden = false;
  let optSmooth = true, optInvert = true, optRaw = false, optWake = false, optSaver = false;
  let cx = 0, cy = 0, radius = 1, dpr = 1;
  let curX = 0, curY = 0, curZ = 0;
  let gravX = 0, gravY = 0, gravZ = 0, gravInit = false;
  let peakMag = 0, lastZ = 0;
  let lastSample = 0, lastReadout = 0, lastFrame = 0;
  let animId = null, resizeTimer = null, sensorTimer = null;
  let screenAngle = 0, rotC = 1, rotS = 0;
  let listening = false, fallback = false, nullSamples = 0;
  let sensorDead = false, stalled = false;
  let flashTimer = null;
  let wakeLock = null;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function liveStatus() {
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }
    if (!started) { setStatus('Waiting', ''); return; }
    if (paused) { setStatus('Paused', ''); return; }
    if (sensorDead) { setStatus('No sensor data', 'err'); return; }
    if (stalled) { setStatus('Sensor stalled', 'warn'); return; }
    if (fallback) setStatus('Live · est. gravity', 'warn');
    else setStatus('Live', 'active');
  }

  function flash(text, cls) {
    setStatus(text, cls);
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { flashTimer = null; liveStatus(); }, 2500);
  }

  function push(x, y, t) {
    bufX[head] = x;
    bufY[head] = y;
    bufT[head] = t;
    head = (head + 1) % CAP;
    if (count < CAP) count++;
    const cutoff = t - HISTORY_MS;
    while (count > 1 && bufT[(head - count + CAP) % CAP] < cutoff) count--;
  }

  function idx(i) {
    return (head - count + i + CAP) % CAP;
  }

  function currentScreenAngle() {
    let angle = null;
    const so = window.screen && screen.orientation;
    if (so && typeof so.angle === 'number') angle = so.angle;
    else if (typeof window.orientation === 'number') angle = window.orientation;

    const landscape = window.innerWidth > window.innerHeight;
    if (angle === null) return landscape ? 90 : 0;

    angle = (angle % 360 + 360) % 360;
    // A tablet whose natural orientation is landscape reports 0 there, while
    // iOS keeps reporting motion in the portrait frame. The viewport shape is
    // the only witness to that gap, so reconcile against it.
    const quarter = angle === 90 || angle === 270;
    return landscape === quarter ? angle : (angle + 270) % 360;
  }

  // The motion axes are fixed to the hardware and ignore screen rotation, so
  // everything already banked is re-expressed in the new screen frame rather
  // than left pointing the old way.
  function applyScreenAngle() {
    const next = currentScreenAngle();
    if (next === screenAngle) return;
    const rad = ((next - screenAngle) % 360 + 360) % 360 * Math.PI / 180;
    const c = Math.cos(rad), s = Math.sin(rad);
    for (let i = 0; i < count; i++) {
      const k = idx(i);
      const x = bufX[k], y = bufY[k];
      bufX[k] = x * c + y * s;
      bufY[k] = -x * s + y * c;
    }
    const nx = curX * c + curY * s;
    curY = -curX * s + curY * c;
    curX = nx;
    screenAngle = next;
    const r = screenAngle * Math.PI / 180;
    rotC = Math.cos(r);
    rotS = Math.sin(r);
    showVersion();
    redrawIfIdle();
  }

  function radiusPx(magG) {
    return magG > 0 ? magG / MAX_G * radius : 0;
  }

  // Soft threshold: shrink toward zero by FLOOR_G rather than clamping to it,
  // so the dot never snaps as a bump crosses the floor.
  function floorScalar(v) {
    const a = Math.abs(v);
    return a <= FLOOR_G ? 0 : (a - FLOOR_G) * (v < 0 ? -1 : 1);
  }

  function projectX(x, mag, r) {
    const px = mag > 1e-6 ? x / mag * r : 0;
    return optInvert ? cx - px : cx + px;
  }

  function projectY(y, mag, r) {
    const py = mag > 1e-6 ? y / mag * r : 0;
    return optInvert ? cy + py : cy - py;
  }

  function getLevel(mag) {
    for (let i = 0; i < LEVELS.length; i++) if (mag >= LEVELS[i].min) return LEVELS[i];
    return LEVELS[LEVELS.length - 1];
  }

  function resizeCanvas() {
    const wrap = canvas.parentElement;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
    canvas.width = bg.width = Math.round(w * dpr);
    canvas.height = bg.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    cx = canvas.width / 2;
    cy = canvas.height / 2;
    radius = Math.min(cx, cy) * 0.9;
    renderBackground();
    draw(0);
  }

  function renderBackground() {
    const w = bg.width, h = bg.height;
    bgCtx.fillStyle = '#0a0a0f';
    bgCtx.fillRect(0, 0, w, h);
    if (!started) return;

    bgCtx.strokeStyle = 'rgba(255,255,255,0.12)';
    bgCtx.lineWidth = 1;
    bgCtx.beginPath(); bgCtx.moveTo(cx, 0); bgCtx.lineTo(cx, h); bgCtx.stroke();
    bgCtx.beginPath(); bgCtx.moveTo(0, cy); bgCtx.lineTo(w, cy); bgCtx.stroke();

    bgCtx.font = (10 * dpr) + 'px -apple-system, sans-serif';
    bgCtx.fillStyle = 'rgba(255,255,255,0.38)';
    bgCtx.textAlign = 'left';
    bgCtx.textBaseline = 'middle';
    bgCtx.fillText('+X', cx + radius * 0.72, cy - 9 * dpr);
    bgCtx.textAlign = 'center';
    bgCtx.fillText('+Y', cx, 36 * dpr);

    const rings = [0.12, 0.3, MAX_G];
    rings.forEach(r => {
      const pr = radiusPx(r);
      bgCtx.beginPath();
      bgCtx.arc(cx, cy, pr, 0, Math.PI * 2);
      bgCtx.strokeStyle = 'rgba(255,255,255,0.14)';
      bgCtx.lineWidth = 1;
      bgCtx.stroke();

      // Inset on the left of the axis: outside the rings the label would be
      // clipped by the canvas edge and collide with the Z bar.
      bgCtx.fillStyle = 'rgba(255,255,255,0.4)';
      bgCtx.textAlign = 'left';
      bgCtx.textBaseline = 'bottom';
      bgCtx.fillText(r + 'G', cx - pr + 5 * dpr, cy - 4 * dpr);
    });
  }

  function draw(dt) {
    ctx.drawImage(bg, 0, 0);
    if (!started) return;

    if (dt > 0) peakMag *= Math.exp(-dt / PEAK_TAU);

    if (count >= 2) {
      // Every sample contributes: each output point is the mean of its slice
      // of the buffer, so discarded samples cannot alias into the trail.
      const m = Math.min(count, renderPoints);
      for (let j = 0; j < m; j++) {
        const lo = Math.floor(j * count / m);
        const hi = Math.max(Math.floor((j + 1) * count / m), lo + 1);
        let sumX = 0, sumY = 0;
        for (let i = lo; i < hi; i++) {
          const k = idx(i);
          sumX += bufX[k];
          sumY += bufY[k];
        }
        const x = sumX / (hi - lo), y = sumY / (hi - lo);
        const mag = Math.sqrt(x * x + y * y);
        const r = radiusPx(mag);
        ptX[j] = projectX(x, mag, r);
        ptY[j] = projectY(y, mag, r);
      }

      if (m >= 2) drawTrail(m);
      drawHead(ptX[m - 1], ptY[m - 1]);
    }

    const lvl = getLevel(peakMag);
    ctx.font = '600 ' + (14 * dpr) + 'px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = lvl.color;
    ctx.fillText(lvl.label.toUpperCase(), cx, 10 * dpr);

    drawZBar(optInvert ? -lastZ : lastZ);
  }

  function drawTrail(m) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const buckets = Math.min(trailBuckets, m - 1);

    for (let b = 0; b < buckets; b++) {
      const from = 1 + Math.floor(b * (m - 1) / buckets);
      const to = Math.floor((b + 1) * (m - 1) / buckets);
      if (to < from) continue;

      ctx.beginPath();
      for (let i = from; i <= to; i++) {
        const x0 = i === 1 ? ptX[0] : (ptX[i - 2] + ptX[i - 1]) / 2;
        const y0 = i === 1 ? ptY[0] : (ptY[i - 2] + ptY[i - 1]) / 2;
        const x2 = i === m - 1 ? ptX[m - 1] : (ptX[i - 1] + ptX[i]) / 2;
        const y2 = i === m - 1 ? ptY[m - 1] : (ptY[i - 1] + ptY[i]) / 2;
        ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(ptX[i - 1], ptY[i - 1], x2, y2);
      }

      const t = (b + 0.5) / buckets;
      const r = Math.round(t * 250 + (1 - t) * 70);
      const g = Math.round(t * 90  + (1 - t) * 150);
      const bl = Math.round(t * 80 + (1 - t) * 255);
      ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + bl + ',' + (Math.pow(t, 1.4) * 0.85 + 0.12).toFixed(2) + ')';
      ctx.lineWidth = (0.9 + t * 2.3) * dpr;
      ctx.stroke();
    }
  }

  function drawHead(hx, hy) {
    ctx.beginPath();
    ctx.arc(hx, hy, 4.5 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    const pulse = (Date.now() % 1000) / 1000;
    ctx.beginPath();
    ctx.arc(hx, hy, (4.5 + pulse * 12) * dpr, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,' + ((1 - pulse) * 0.4).toFixed(2) + ')';
    ctx.lineWidth = 1.5 * dpr;
    ctx.stroke();
  }

  function roundRect(c, x, y, w, h, r) {
    if (c.roundRect) { c.beginPath(); c.roundRect(x, y, w, h, r); return; }
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function drawZBar(z) {
    const barW = 10 * dpr;
    const barH = canvas.height * 0.6;
    const barX = canvas.width - barW - 4 * dpr;
    const barY = cy - barH / 2;

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(ctx, barX, barY, barW, barH, 4 * dpr);
    ctx.fill();

    const mag = Math.min(Math.abs(z || 0), MAX_G);
    const zT = radiusPx(mag) / radius;
    const fillH = Math.min(zT, 1) * (barH / 2);
    const fillY = z >= 0 ? cy - fillH : cy;
    const zR = Math.round(zT * 180 + (1 - zT) * 120);
    const zG = Math.round(zT * 95  + (1 - zT) * 195);
    const zB = Math.round(zT * 230 + (1 - zT) * 215);
    ctx.fillStyle = 'rgba(' + zR + ',' + zG + ',' + zB + ',0.85)';
    roundRect(ctx, barX, fillY, barW, Math.max(fillH, 1), 3 * dpr);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(barX, cy);
    ctx.lineTo(barX + barW, cy);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = (10 * dpr) + 'px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('Z', barX + barW / 2, barY - 3 * dpr);
  }

  function fmt(v) {
    return (v >= 0 ? '+' : '') + v.toFixed(3) + 'G';
  }

  function onMotion(e) {
    if (sensorTimer) { clearTimeout(sensorTimer); sensorTimer = null; }
    if (paused) return;

    const now = performance.now();
    const dt = lastSample ? Math.min((now - lastSample) / 1000, 0.25) : 1 / 60;
    lastSample = now;

    let ax, ay, az, dirtyStatus = false;
    const acc = e.acceleration;
    if (acc && (acc.x !== null || acc.y !== null || acc.z !== null)) {
      ax = (acc.x || 0) / G;
      ay = (acc.y || 0) / G;
      az = (acc.z || 0) / G;
      if (fallback) { fallback = false; dirtyStatus = true; }
    } else {
      const raw = e.accelerationIncludingGravity;
      if (!raw || (raw.x === null && raw.y === null && raw.z === null)) {
        if (++nullSamples === 20 && !sensorDead) { sensorDead = true; liveStatus(); }
        return;
      }
      // Gravity-included fallback: subtract a slow-moving estimate of gravity.
      const gx = (raw.x || 0) / G, gy = (raw.y || 0) / G, gz = (raw.z || 0) / G;
      if (!gravInit) { gravX = gx; gravY = gy; gravZ = gz; gravInit = true; }
      const ga = 1 - Math.exp(-dt / GRAVITY_TAU);
      gravX += (gx - gravX) * ga;
      gravY += (gy - gravY) * ga;
      gravZ += (gz - gravZ) * ga;
      ax = gx - gravX;
      ay = gy - gravY;
      az = gz - gravZ;
      if (!fallback) { fallback = true; dirtyStatus = true; }
    }
    if (rotS !== 0 || rotC !== 1) {
      const rx = ax * rotC + ay * rotS;
      ay = -ax * rotS + ay * rotC;
      ax = rx;
    }

    nullSamples = 0;
    if (sensorDead) { sensorDead = false; dirtyStatus = true; }
    if (stalled) { stalled = false; dirtyStatus = true; }
    if (dirtyStatus) liveStatus();

    const a = 1 - Math.exp(-dt / SMOOTH_TAU);
    curX += (ax - curX) * a;
    curY += (ay - curY) * a;
    curZ += (az - curZ) * a;

    let px = optSmooth ? curX : ax;
    let py = optSmooth ? curY : ay;
    let pz = optSmooth ? curZ : az;

    const m = Math.sqrt(px * px + py * py);
    if (m <= FLOOR_G) { px = 0; py = 0; }
    else { const k = (m - FLOOR_G) / m; px *= k; py *= k; }
    lastZ = floorScalar(pz);

    const mag = Math.sqrt(px * px + py * py);
    if (mag > peakMag) peakMag = mag;

    push(px, py, now);

    if (optRaw && now - lastReadout >= readoutMs) {
      lastReadout = now;
      numX.textContent = fmt(px);
      numY.textContent = fmt(py);
      numZ.textContent = fmt(lastZ);
    }
  }

  function loop(ts) {
    animId = requestAnimationFrame(loop);
    const elapsed = ts - lastFrame;
    if (elapsed < frameMs - FRAME_SLACK_MS) return;
    lastFrame = ts;
    draw(Math.min(elapsed / 1000, 0.25));
    if (!stalled && !sensorDead && lastSample && ts - lastSample > STALL_MS) {
      stalled = true;
      liveStatus();
    }
  }

  function startLoop() {
    if (animId !== null) return;
    lastFrame = performance.now();
    animId = requestAnimationFrame(loop);
  }

  function stopLoop() {
    if (animId === null) return;
    cancelAnimationFrame(animId);
    animId = null;
  }

  function startTracking() {
    if (listening) return;
    window.addEventListener('devicemotion', onMotion);
    listening = true;
    started = true;
    controls.classList.add('visible');
    liveStatus();
    renderBackground();
    startLoop();
    sensorTimer = setTimeout(() => {
      sensorTimer = null;
      sensorDead = true;
      liveStatus();
    }, SENSOR_TIMEOUT_MS);
  }

  function requestPermission() {
    if (typeof DeviceMotionEvent === 'undefined') {
      setStatus('No motion sensor', 'err');
      return;
    }
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(state => {
          if (state === 'granted') {
            startBtn.style.display = 'none';
            startTracking();
          } else {
            setStatus('Permission denied', 'err');
          }
        })
        .catch(err => setStatus('Error: ' + err.message, 'err'));
    } else {
      startBtn.style.display = 'none';
      startTracking();
    }
  }

  function releaseWakeLock() {
    if (!wakeLock) return;
    const lock = wakeLock;
    wakeLock = null;
    lock.release().catch(() => {});
  }

  function acquireWakeLock() {
    if (!('wakeLock' in navigator) || wakeLock || hidden) return;
    navigator.wakeLock.request('screen')
      .then(lock => {
        if (!optWake) { lock.release().catch(() => {}); return; }
        wakeLock = lock;
        lock.addEventListener('release', () => { wakeLock = null; });
      })
      .catch(() => {
        optWake = false;
        btnWake.classList.remove('on');
        flash('Wake lock refused', 'warn');
      });
  }

  function applyTier() {
    const t = optSaver ? TIERS.saver : TIERS.high;
    frameMs = t.frameMs;
    maxDpr = t.maxDpr;
    renderPoints = t.points;
    trailBuckets = t.buckets;
    readoutMs = t.readoutMs;
    resizeCanvas();
  }

  function redrawIfIdle() {
    if (started && animId === null && !hidden) draw(0);
  }

  btnClear.addEventListener('click', () => {
    head = 0;
    count = 0;
    peakMag = 0;
    redrawIfIdle();
  });

  function makeToggle(btn, get, set) {
    btn.addEventListener('click', () => {
      set(!get());
      btn.classList.toggle('on', get());
      redrawIfIdle();
    });
  }
  makeToggle(btnSmooth, () => optSmooth, v => { optSmooth = v; });
  makeToggle(btnInvert, () => optInvert, v => { optInvert = v; });
  makeToggle(btnRaw, () => optRaw, v => {
    optRaw = v;
    readout.classList.toggle('hidden', !optRaw);
    controls.classList.toggle('above-readout', optRaw);
    resizeCanvas();
  });
  makeToggle(btnSaver, () => optSaver, v => {
    optSaver = v;
    applyTier();
  });
  makeToggle(btnWake, () => optWake, v => {
    optWake = v;
    if (optWake) acquireWakeLock();
    else releaseWakeLock();
  });

  btnPause.addEventListener('click', () => {
    paused = !paused;
    btnPause.textContent = paused ? 'Resume' : 'Pause';
    if (paused) {
      lastSample = 0;
      stopLoop();
      draw(0);
    } else {
      startLoop();
    }
    liveStatus();
  });

  if (!('wakeLock' in navigator)) btnWake.disabled = true;

  document.addEventListener('visibilitychange', () => {
    hidden = document.hidden;
    if (hidden) {
      stopLoop();
      releaseWakeLock();
    } else {
      lastSample = 0;
      if (started && !paused) startLoop();
      if (optWake) acquireWakeLock();
      checkForUpdate();
    }
  });

  // iOS fires orientationchange before the viewport reflows, so the angle is
  // resolved again once the new dimensions are readable.
  function onResize() {
    applyScreenAngle();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { applyScreenAngle(); resizeCanvas(); }, 120);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', applyScreenAngle);
  }

  const versionText = versionEl.textContent.trim();
  const localVersion = (versionText.match(/v[\d.]+/) || [])[0];
  let lastUpdateCheck = 0, updateOffered = false;

  function showVersion() {
    if (updateOffered) return;
    versionEl.textContent = versionText + ' \u00b7 ' + screenAngle + '\u00b0';
  }

  function storedReload() {
    try { return sessionStorage.getItem('rr-reloaded'); } catch (e) { return null; }
  }

  function reloadFresh(remote) {
    try { sessionStorage.setItem('rr-reloaded', remote); } catch (e) {}
    location.replace(location.pathname + '?v=' + remote.replace(/^v/, ''));
  }

  function offerUpdate(remote) {
    if (updateOffered) return;
    updateOffered = true;
    versionEl.textContent = localVersion + ' \u2192 ' + remote + '  tap to update';
    versionEl.classList.add('stale');
    versionEl.addEventListener('click', () => reloadFresh(remote), { once: true });
  }

  // The stale copy is already parsed by the time this runs, so the only way
  // out is to re-request under a URL the cache has never seen. A tab left open
  // is the case that needs this most, so it re-checks rather than only at load.
  function checkForUpdate() {
    if (!localVersion || location.protocol === 'file:') return;
    if (document.hidden || updateOffered) return;
    const now = Date.now();
    if (now - lastUpdateCheck < UPDATE_GAP_MS) return;
    lastUpdateCheck = now;
    fetch(location.pathname + '?cb=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(text => {
        const el = new DOMParser().parseFromString(text, 'text/html').getElementById('version');
        const remote = el && (el.textContent.match(/v[\d.]+/) || [])[0];
        if (!remote || remote === localVersion) return;
        if (started || storedReload() === remote) offerUpdate(remote);
        else reloadFresh(remote);
      })
      .catch(() => {});
  }

  startBtn.addEventListener('click', requestPermission);
  applyScreenAngle();
  showVersion();
  resizeCanvas();
  checkForUpdate();
  setInterval(checkForUpdate, UPDATE_EVERY_MS);
})();
</script>
</body>
</html>
